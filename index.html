<!DOCTYPE html>
<html style="background:#090a0f;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirect</title>

  <script>
    (function () {
      // Current time in India (IST)
      const now = new Date();
      const indiaTime = new Date(
        now.toLocaleString("en-US", {
          timeZone: "Asia/Kolkata"
        })
      );

      const hours = indiaTime.getHours();
      const minutes = indiaTime.getMinutes();

      // Allow access from 9:00 AM to 9:59 AM IST
      if (hours === 9) {
        window.location.replace(
          "https://script.google.com/macros/s/AKfycbxPr6aoGOGE3TtNFkBX5oRquhgenh4b1PY8buhXlr3_-68SQrx5NGi7LEw2vxFlNbuo/exec/"
        );
      } else {
        // Show the image at all other times
        document.documentElement.innerHTML = `
          <head>
            <meta charset="UTF-8">
            <meta name="viewport"
                  content="width=device-width, initial-scale=1.0">
            <title>Image</title>
            <style>
              html, body {
                margin: 0;
                width: 100%;
                height: 100%;
                background: #090a0f;
                display: flex;
                align-items: center;
                justify-content: center;
              }
              img {
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
              }
            </style>
          </head>
          <body>
            <img
              src="https://img.wapka.org/00hnq2.jpg"
              alt="Image"
            >
          </body>
        `;
      }
    })();
  </script>
</head>
<body></body>
</html>
